name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm JobTracker.spec
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: JobTracker-Windows
          path: dist/JobTracker.exe
          if-no-files-found: error
      - name: Read application version
        shell: pwsh
        run: |
          $version = python -c "from app.config import APP_VERSION; print(APP_VERSION)"
          if (-not $version) { throw "Unable to read APP_VERSION" }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found after installation"
          }
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler "/DMyAppVersion=$env:APP_VERSION" "packaging\windows\JobTracker.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          $installer = "dist\JobTracker-v$env:APP_VERSION-Windows-Setup.exe"
          if (-not (Test-Path $installer)) { throw "Expected installer was not created: $installer" }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: JobTracker-Windows-Setup
          path: dist/JobTracker-v*-Windows-Setup.exe
          if-no-files-found: error
